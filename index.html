<!DOCTYPE html>
<html lang="pt-br">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
   <meta name="apple-mobile-web-app-capable" content="yes">
   <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
   <title>Nubank</title>
   <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
   <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
   <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
   <script src="https://cdn.tailwindcss.com"></script>
   <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
   <style>
       body {
           font-family: 'Inter', sans-serif;
           background-color: black;
           margin: 0;
           padding: 0;
           -webkit-tap-highlight-color: transparent;
           user-select: none;
           overscroll-behavior: none;
       }
       .no-scrollbar::-webkit-scrollbar { display: none; }
       .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
       @keyframes bounce-short { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
       .animate-bounce-short { animation: bounce-short 0.5s ease-in-out 1; }
       @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
       .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }
   </style>
</head>
<body>
   <div id="root"></div>

   <script type="text/babel">
       const { useState, useRef } = React;

       const Icons = {
           Pix: () => (
               <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="white" strokeWidth="1.2">
                   <path d="M12 4L4 12L12 20L20 12L12 4Z" />
                   <path d="M12 9L9 12L12 15L15 12L12 9Z" />
               </svg>
           ),
           Pagar: () => (
               <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="white" strokeWidth="1.2">
                   <circle cx="12" cy="12" r="9" />
                   <path d="M9 8.5V15.5M12 8.5V15.5M15 8.5V15.5" />
               </svg>
           ),
           Emprestimo: () => (
               <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="white" strokeWidth="1.2">
                   <path d="M12 7V17M9 9.5C9 9.5 10 8.5 12 8.5C14 8.5 15 9.5 15 10.5C15 11.5 14 12.5 12 12.5C10 12.5 9 13.5 9 14.5C9 15.5 10 16.5 12 16.5C14 16.5 15 15.5 15 15.5" />
                   <circle cx="12" cy="12" r="9" />
               </svg>
           ),
           Transferir: () => (
               <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="white" strokeWidth="1.2">
                   <rect x="5" y="7" width="14" height="10" rx="1" />
                   <path d="M15 12L19 12M15 12L17 10M15 12L17 14" />
                   <circle cx="10" cy="12" r="2.5" />
               </svg>
           ),
           Recarga: () => (
               <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="white" strokeWidth="1.2">
                   <rect x="7" y="4" width="10" height="16" rx="2" />
                   <line x1="11" y1="17" x2="13" y2="17" />
               </svg>
           ),
           BottomArrows: () => (
               <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="white" strokeWidth="2.5">
                   <path d="M7 10L12 5L17 10" />
                   <path d="M17 14L12 19L7 14" />
               </svg>
           ),
           Dollar: () => (
               <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" strokeWidth="1.5">
                   <path d="M12 2V22M17 5H9.5C8 5 7 6 7 7.5C7 9 8 10 9.5 10H14.5C16 10 17 11 17 12.5C17 14 16 15 14.5 15H7" />
               </svg>
           ),
           Bag: () => (
               <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" strokeWidth="1.5">
                   <path d="M6 8V6C6 4.89543 6.89543 4 8 4H16C17.1046 4 18 4.89543 18 6V8" />
                   <rect x="4" y="8" width="16" height="12" rx="2" />
               </svg>
           ),
           ChevronRight: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>,
           Eye: () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>,
           EyeOff: () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>,
           ArrowLeft: () => <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>,
           Help: () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,
           UserPlus: () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>,
           X: () => <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
           Check: () => <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
       };

       const App = () => {
           const [showBalance, setShowBalance] = useState(true);
           const [balance, setBalance] = useState(1579.90);
           const [currentScreen, setCurrentScreen] = useState("home");
           const [step, setStep] = useState(1);
           const [pixKey, setPixKey] = useState("");
           const [pixAmount, setPixAmount] = useState("");
           const [profileImg, setProfileImg] = useState(null);
           
           const fileInputRef = useRef(null);

           const handleImageChange = (e) => {
               const file = e.target.files[0];
               if (file) {
                   const reader = new FileReader();
                   reader.onloadend = () => setProfileImg(reader.result);
                   reader.readAsDataURL(file);
               }
           };

           const finalizeTransfer = () => {
               const amount = parseFloat(pixAmount.replace(',', '.'));
               if (!isNaN(amount)) setBalance(prev => prev - amount);
               setStep(3);
               setTimeout(() => setStep(4), 1800);
           };

           if (currentScreen !== "home") {
               if (step === 4) {
                   return (
                       <div className="min-h-screen bg-[#820ad1] text-white flex flex-col p-8 animate-fade-in">
                           <div className="flex justify-end">
                               <button onClick={() => {setCurrentScreen("home"); setStep(1); setPixKey(""); setPixAmount("");}}><Icons.X /></button>
                           </div>
                           <div className="flex-1 flex flex-col items-center justify-center text-center">
                               <div className="w-20 h-20 bg-white rounded-full flex items-center justify-center mb-6 shadow-xl animate-bounce-short">
                                   <Icons.Check />
                               </div>
                               <h2 className="text-3xl font-bold mb-4">Pronto!</h2>
                               <p className="text-lg opacity-90 mb-2">Transferência realizada</p>
                               <p className="text-sm opacity-70 mb-12">R$ {parseFloat(pixAmount.replace(',', '.')).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</p>
                               <button onClick={() => {setCurrentScreen("home"); setStep(1); setPixKey(""); setPixAmount("");}} className="w-full py-4 bg-white text-[#820ad1] rounded-full font-bold">Concluir</button>
                           </div>
                       </div>
                   );
               }

               return (
                   <div className="min-h-screen bg-black text-white flex flex-col p-6">
                       <button onClick={() => step === 1 ? setCurrentScreen("home") : setStep(1)}><Icons.ArrowLeft /></button>
                       <div className="flex-1 mt-8">
                           {step === 1 ? (
                               <div className="animate-fade-in">
                                   <h2 className="text-3xl font-bold">Para quem transferir?</h2>
                                   <input autoFocus type="text" placeholder="CPF ou E-mail" className="w-full bg-transparent border-b border-zinc-800 py-4 text-xl outline-none mt-8" value={pixKey} onChange={e => setPixKey(e.target.value)} />
                               </div>
                           ) : step === 2 ? (
                               <div className="animate-fade-in">
                                   <h2 className="text-3xl font-bold">Qual o valor?</h2>
                                   <div className="flex items-baseline gap-2 mt-12">
                                       <span className="text-4xl font-bold text-zinc-700">R$</span>
                                       <input autoFocus type="number" className="w-full bg-transparent text-6xl font-bold outline-none" value={pixAmount} onChange={e => setPixAmount(e.target.value)} />
                                   </div>
                               </div>
                           ) : (
                               <div className="flex-1 flex flex-col items-center justify-center">
                                   <div className="w-16 h-16 border-4 border-zinc-900 border-t-[#820ad1] rounded-full animate-spin mb-4"></div>
                                   <p className="font-bold">Processando...</p>
                               </div>
                           )}
                       </div>
                       {step < 3 && (
                           <div className="pb-8">
                               <button onClick={() => step === 1 ? setStep(2) : finalizeTransfer()} className="w-full py-4 bg-[#820ad1] rounded-full font-bold">Continuar</button>
                           </div>
                       )}
                   </div>
               );
           }

           return (
               <div className="min-h-screen bg-black text-white flex flex-col overflow-hidden">
                   <input type="file" ref={fileInputRef} className="hidden" accept="image/*" onChange={handleImageChange} />
                   
                   <header className="bg-[#820ad1] px-5 pt-12 pb-6">
                       <div className="flex justify-between items-center mb-6">
                           <div
                               onClick={() => fileInputRef.current.click()}
                               className="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center border border-white/10 font-bold overflow-hidden"
                           >
                               {profileImg ? <img src={profileImg} className="w-full h-full object-cover" /> : "DA"}
                           </div>
                           <div className="flex items-center gap-5">
                               <button onClick={() => setShowBalance(!showBalance)}>{showBalance ? <Icons.Eye /> : <Icons.EyeOff />}</button>
                               <Icons.Help />
                               <Icons.UserPlus />
                           </div>
                       </div>
                       <h1 className="text-lg font-bold">Olá, Davi</h1>
                   </header>

                   <main className="flex-1 overflow-y-auto pb-40 no-scrollbar">
                       <div className="p-5 flex justify-between items-center" onClick={() => setShowBalance(!showBalance)}>
                           <div>
                               <h3 className="text-lg font-semibold mb-1">Conta</h3>
                               {showBalance ? <p className="text-xl font-bold">R$ {balance.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</p> : <div className="h-7 w-32 bg-zinc-800 rounded mt-1" />}
                           </div>
                           <Icons.ChevronRight />
                       </div>

                       <div className="flex gap-1 overflow-x-auto no-scrollbar px-4 py-4">
                           {[
                               {icon: Icons.Pix, label: "Área Pix", act: () => setCurrentScreen("pix")},
                               {icon: Icons.Pagar, label: "Pagar"},
                               {icon: Icons.Emprestimo, label: "Pegar emprestado"},
                               {icon: Icons.Transferir, label: "Transferir", act: () => setCurrentScreen("transferir")},
                               {icon: Icons.Recarga, label: "Recarga celular"}
                           ].map((item, i) => (
                               <div key={i} className="flex flex-col items-center gap-3 min-w-[95px]" onClick={item.act}>
                                   <div className="w-[72px] h-[72px] bg-[#1a1a1a] rounded-full flex items-center justify-center"><item.icon /></div>
                                   <span className="text-[11px] font-bold text-center">{item.label}</span>
                               </div>
                           ))}
                       </div>

                       <div className="mx-5 my-4 bg-[#1a1a1a] p-4 rounded-xl flex items-center gap-4 border border-zinc-900 font-bold text-sm">
                           <Icons.Recarga /> Meus cartões
                       </div>

                       <div className="h-[1px] bg-zinc-900/50 mx-5 my-4" />
                       
                       <div className="px-5 py-4">
                           <div className="flex justify-between items-center mb-4">
                               <h3 className="text-lg font-semibold">Cartão de crédito</h3>
                               <Icons.ChevronRight />
                           </div>
                           <p className="text-zinc-400 font-medium text-sm">Fatura atual</p>
                           <p className="text-xl font-bold mt-1 text-zinc-300">R$ 0,00</p>
                       </div>
                   </main>

                   <div className="fixed bottom-8 left-1/2 -translate-x-1/2 flex items-center gap-12 bg-[#121212]/95 backdrop-blur-xl px-10 py-4 rounded-full border border-zinc-800 shadow-2xl">
                       <div className="relative">
                           <div className="bg-[#820ad1] p-2.5 rounded-full text-white"><Icons.BottomArrows /></div>
                           <div className="absolute -bottom-1.5 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#820ad1] rounded-full shadow-[0_0_8px_#820ad1]"></div>
                       </div>
                       <div className="text-zinc-600"><Icons.Dollar /></div>
                       <div className="text-zinc-600"><Icons.Bag /></div>
                   </div>
               </div>
           );
       };

       const root = ReactDOM.createRoot(document.getElementById('root'));
       root.render(<App />);
   </script>
</body>
</html>
